packages:
  cmake:
    paths:
      cmake@3.8.2: /usr/common/software/cmake/3.8.2
      buildable: False
  mpich:
    modules:
      mpich@7.6.0: cray-mpich/7.6.0
    buildable: False
  openssl:
    paths:
      openssl@1.0.2j: /usr
    buildable: False
  perl:
    paths:
      perl@5.18.2: /usr
    buildable: False
  python:
    paths:
      python@2.7.9: /usr
    buildable: False
  all:
    compiler: [gcc@6.3.0.cori, intel@2018.0.128.6.4.0]
    providers:
      mkl: [intel-mkl]
      mpi: [mpich]
      blas: [intel-mkl]
      lapack: [intel-mkl]
      scalapack: [intel-mkl]
